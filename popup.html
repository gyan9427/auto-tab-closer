<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auto Tab Closer</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 12px; width: 260px; }
      h1 { font-size: 16px; margin: 0 0 8px 0; }
      p { font-size: 13px; color: #5f6368; margin: 6px 0 12px 0; }
      button { padding: 8px 12px; font-size: 13px; border-radius: 6px; border: none; background: #1a73e8; color: #fff; cursor: pointer; }
      .row { display:flex; gap:8px; align-items:center; }
      .muted { font-size:12px; color:#666; }
    </style>
  </head>
  <body>
    <h1>Auto Tab Closer</h1>
    <p class="muted">Extract topics from this tab and add them to your focus list.</p>

    <section id="topicsSection">
      <p class="muted" id="topicsStatus">Loading topics from this page...</p>
      <div id="topicsContainer" style="max-height: 160px; overflow-y: auto; margin-bottom: 8px;"></div>
      <div class="row" style="justify-content: space-between;">
        <button id="addTopics" disabled>Add topics</button>
        <button id="openOptions">Open Settings</button>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
